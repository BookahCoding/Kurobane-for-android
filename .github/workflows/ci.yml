name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned to commits, not tags (same pins as the release workflow and the Herald repo).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The wrapper must be executable in git (mode 100755); `git update-index --chmod=+x gradlew` fixes it.
      - name: Unit tests
        run: ./gradlew --no-daemon :shared:core:allTests

      - name: Lint
        run: ./gradlew --no-daemon :androidApp:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug

      - name: Assemble release APK (unsigned build, checks the release configuration compiles)
        run: ./gradlew --no-daemon :androidApp:assembleRelease
