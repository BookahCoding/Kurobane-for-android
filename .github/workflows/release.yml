# Publishing a release = pushing a tag vMAJOR.MINOR.PATCH on a commit that is already on main.
# The workflow tests, builds the signed APK, checks it, and attaches it as `kurobane-android.apk` (the exact
# asset name the in-app updater looks for) to a published, non-draft GitHub Release.
#
# "Run workflow" (workflow_dispatch) is a DRY RUN: same build and checks, but the APK is only uploaded as a
# workflow artifact and nothing is published. Do a dry run with the real secrets before the first tag.
#
# One-time setup (see README, "Releasing"):
#   Repo secrets (Settings → Secrets and variables → Actions):
#     ANDROID_KEYSTORE_B64       the release keystore, base64-encoded
#     ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Committed file release-signing-cert.sha256: the SHA-256 fingerprint of the signing certificate (public data).
#     The workflow refuses to publish an APK signed with any other key, so updates keep installing over each other.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run: version to build, for example 0.5.1 (nothing is published)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'dry-run' || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - name: Resolve the version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then tag="$REF_NAME"; else tag="v$(echo -n "$INPUT_VERSION" | tr -d ' ' | sed 's/^v//')"; fi
          if ! echo "$tag" | grep -qE '^v(0|[1-9][0-9]{0,1})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$'; then
            echo "::error::'$tag' is not vMAJOR.MINOR.PATCH (minor and patch must stay below 100 so the versionCode keeps increasing)." >&2; exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit must be on main and newer than the latest release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$RELEASE_TAG is not on main. Merge first, then tag the merged commit." >&2; exit 1
          fi
          latest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$RELEASE_TAG" | sort -V | tail -1)" != "$RELEASE_TAG" ]; then
            echo "::error::$RELEASE_TAG is not newer than the latest release $latest." >&2; exit 1
          fi
          if [ "$latest" = "$RELEASE_TAG" ]; then echo "::error::$RELEASE_TAG already exists." >&2; exit 1; fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Write the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret for $v is missing. See README, 'Releasing'." >&2; exit 1; fi
          done
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test
        run: ./gradlew --no-daemon :shared:core:allTests :androidApp:lintDebug

      - name: Build the signed release APK
        run: ./gradlew --no-daemon :androidApp:assembleRelease -PappVersion="$RELEASE_VERSION" -PreleasesRepo="$GITHUB_REPOSITORY"

      - name: Check the APK (signature, certificate, package, version)
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bt="$sdk/build-tools/$(ls "$sdk/build-tools" | sort -V | tail -1)"
          apk=$(ls androidApp/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" kurobane-android.apk

          "$bt/apksigner" verify --verbose --print-certs kurobane-android.apk | tee signer.txt
          cert=$(grep -m1 'certificate SHA-256 digest' signer.txt | sed 's/.*: *//' | tr 'A-F' 'a-f')
          [ -n "$cert" ] || { echo "::error::The APK has no readable signing certificate." >&2; exit 1; }
          echo "Signing certificate SHA-256: $cert"
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"
          if grep -q 'Android Debug' signer.txt; then echo "::error::The APK is signed with a debug key." >&2; exit 1; fi

          if [ -f release-signing-cert.sha256 ]; then
            expected=$(tr -d ' \n\r:' < release-signing-cert.sha256 | tr 'A-F' 'a-f')
            if [ "$cert" != "$expected" ]; then
              echo "::error::The APK is signed with a different key ($cert) than release-signing-cert.sha256 ($expected). Updates would not install over the existing app." >&2; exit 1
            fi
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::release-signing-cert.sha256 is missing. Commit the fingerprint printed by a dry run (README, 'Releasing')." >&2; exit 1
          else
            echo "::warning::release-signing-cert.sha256 is not committed yet; this dry run only prints the fingerprint ($cert)."
          fi

          "$bt/aapt2" dump badging kurobane-android.apk > badging.txt
          badging=$(grep -m1 '^package:' badging.txt)
          echo "$badging"
          IFS=. read -r ma mi pa <<< "$RELEASE_VERSION"
          want=$((ma * 10000 + mi * 100 + pa))
          echo "$badging" | grep -q "name='dev.kurobane.android'" || { echo "::error::Unexpected package name." >&2; exit 1; }
          echo "$badging" | grep -q "versionCode='$want'" || { echo "::error::Expected versionCode $want." >&2; exit 1; }
          echo "$badging" | grep -q "versionName='$RELEASE_VERSION'" || { echo "::error::Expected versionName $RELEASE_VERSION." >&2; exit 1; }
          sha256sum kurobane-android.apk | tee kurobane-android.apk.sha256

      - name: Dry run - keep the APK as a workflow artifact only
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kurobane-android-dry-run
          path: |
            kurobane-android.apk
            kurobane-android.apk.sha256
          retention-days: 3

      - name: Publish the GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/$RELEASE_TAG.txt"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$RELEASE_TAG" --verify-tag --latest --title "Kurobane for Android $RELEASE_VERSION" \
            "${notes_args[@]}" kurobane-android.apk kurobane-android.apk.sha256

          # The app only offers this release if the asset has exactly this name and address.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx 'kurobane-android.apk' \
            || { echo "::error::The release has no kurobane-android.apk asset." >&2; exit 1; }
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/kurobane-android.apk" -o check.apk
          [ "$(sha256sum < check.apk)" = "$(sha256sum < kurobane-android.apk)" ] \
            || { echo "::error::The published asset differs from the built APK." >&2; exit 1; }

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
